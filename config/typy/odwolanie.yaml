typ: odwolanie
opis: Odwołanie do KIO
znaczniki: [odwołujący, zarzut, wnoszę, zamawiający]
wykluczenia: [przewodniczący]
szablon:
  OdwolanieKIO: {data: null, czynnosc_dzien: null, czynnosc_powod_id: null, czynnosc_opis: null,
    miejscowosc: null}
  Odwolujacy:
  - krs: null
    nazwa: null
    nip: null
    regon: null
    przez-pelnomocnika: null
    pelnomocnik: {imie_nazwisko: null, nazwa: null, mail: null}
  Zamawiajacy:
  - {krs: null, nazwa: null, nip: null, regon: null, prowadzacy_postepowanie: null}
  ZamowieniePubliczne: {numer_bzp: null, numer_postepowania: null, numer_ted: null,
    tytul: null}

# Kontekst sprawy (docs/potok.md): puste pole bierze wartość z innego dokumentu sprawy, jeśli jest w tym tekście.
kontekst:
  Odwolujacy[].nazwa: {pelnomocnictwo: 'mocodawca[].data.nazwa'}
  Odwolujacy[].nip: {pelnomocnictwo: 'mocodawca[].data.nip'}
  Odwolujacy[].krs: {pelnomocnictwo: 'mocodawca[].data.krs'}
  Odwolujacy[].pelnomocnik.imie_nazwisko: {pelnomocnictwo: 'pelnomocnicy[].imie_nazwisko'}
wzorce:
  # Nagłówek strony: dowolna wielkość liter („ODWOŁUJĄCY:”), potem dwukropek albo koniec linii. Bez myślnika:
  # „Zamawiający – Gmina … – prowadzi” w treści to nie nagłówek.
  KONIEC_NAGLOWKA: '[ \t]*(?::|$)'
  NAGLOWEK_ODWOLUJACEGO: '(?i:Odwołujący)(?:\s+się)?{KONIEC_NAGLOWKA}'
  NAGLOWEK_ZAMAWIAJACEGO: '(?i:Zamawiający)(?:\s*\([^)]*\))?{KONIEC_NAGLOWKA}'
  # Nagłówek jednego z kilku Zamawiających („<nr>) Zamawiający – Lider”), bez dwukropka.
  PUNKT_ZAMAWIAJACEGO: '{POCZATEK_LINII}(?:\d+\)\s*)?(?i:Zamawiający)\b[^\n:]*'
  # Sekcja strony: od nagłówka „Odwołujący:” albo „Zamawiający:” do następnego nagłówka (także „Wykonawca wybrany …:”).
  KONIEC_SEKCJI: '(?={POCZATEK_LINII}(?:{NAGLOWEK_ODWOLUJACEGO}|{NAGLOWEK_ZAMAWIAJACEGO}|(?i:Wykonawca|dotyczy|ODWOŁANIE|Działając))|\Z)'
  ODWOLUJACY: '{POCZATEK_LINII}{NAGLOWEK_ODWOLUJACEGO}[\s\S]*?{KONIEC_SEKCJI}'
  # Konsorcjum: dane Odwołującego to dane lidera, do nagłówka „Partner Konsorcjum:”.
  # Partner bywa przed nazwą („<nr>) Partner Konsorcjum:”) albo za nią („<nr>) Lumidor sp. z o.o. (Partner Konsorcjum)”, skany UZP).
  LIDER: '{POCZATEK_LINII}{NAGLOWEK_ODWOLUJACEGO}[\s\S]*?(?:(?={POCZATEK_LINII}\d+\)[^\n]*Partner)|{KONIEC_SEKCJI})'
  ZAMAWIAJACY: '{POCZATEK_LINII}{NAGLOWEK_ZAMAWIAJACEGO}[\s\S]*?{KONIEC_SEKCJI}'
  # Reszta linii za dwukropkiem nagłówka („Odwołujący: Asterion sp. k.”, skany UZP) albo następny wiersz.
  # Nie „Konsorcjum wykonawców …” ani „Zamawiający wspólnie …”: wtedy nazwy są w punktach niżej.
  # Nazwa przechodzi do następnej linii po przyimku („… Straży Pożarnej w” / „Jarzębinie”, skany UZP).
  WIERSZ_ZA_NAGLOWKIEM: ':[ \t]*(?:\n[ \t]*)?(?!\s|Konsorcj|Zamawiaj)((?:[^\n]*[ \t](?:w|we|i)[ \t]*\n[ \t]*)?[^\n]+)'
  # Pierwsza zaskarżona czynność: „Zamawiający w dniu … roku <czynność>”, pierwszy punkt listy po „polegających na:”
  # albo po „wnoszę odwołanie wobec:” („<nr>. czynności Zamawiającego polegającej na odrzuceniu …”, skany UZP).
  PIERWSZY_PUNKT: 'polegając\w*\s+na:?(?:\s+Strona[^\n]*)?\s+\d+\)'
  # Między „wobec:” a punktem bywa stopka strony i pieczęć dowolnej długości; punkt listy kończy się „;”.
  WOBEC: 'wobec:[^;]*?{POCZATEK_LINII}\d+\.(?:\s+czynności(?:\s+Zamawiającego\s+polegając\w*\s+na)?)?'
  CZYNNOSC: '(?:Zamawiający\s+w\s+dniu\s+{DATA}\s+(?:roku|r\.)|{PIERWSZY_PUNKT}|{WOBEC})\s+'
  # Nagłówek pisma w jednej linii: „Kraków, dnia <data>”, „Kraków <data>”.
  PRZED_DATA: ',?[ \t]+(?:dnia[ \t]+)?'
  ETYKIETA_BZP: '(?:o\s+zamówieniu|BZP|Zamówień\s+Publicznych)[\s:]*(?:w\s+BZP[\s:]*)?(?:nr\s+)?'
  ETYKIETA_TED: '(?:TED|Urzędowym\s+U\w*(?:\s+Europejskiej)?)\W*(?:nr\s+)?'

pola:
  OdwolanieKIO.data:
    wzorce: ['{POCZATEK_LINII}{MIEJSCOWOSC}{PRZED_DATA}({DATA})']
    format: data
  OdwolanieKIO.miejscowosc:
    wzorce: ['{POCZATEK_LINII}({MIEJSCOWOSC}){PRZED_DATA}{DATA}']
  OdwolanieKIO.czynnosc_dzien:
    wzorce: ['Zamawiający\s+w\s+dniu\s+({DATA})', '{PIERWSZY_PUNKT}[^;]*?({DATA})', '{WOBEC}[^;]*?({DATA})', 'wobec:[^;]*?({DATA})',
             'czynności\s+został\w*\s+[^.;]*?w\s+dniu\s+({DATA})']
    format: data
  OdwolanieKIO.czynnosc_opis:
    wzorce: &czynnosci
    - {wzorzec: '{CZYNNOSC}(?:poinformował\w*\s+o\s+)?odrzuceni\w*\s+oferty', wartosc: Decyzja o odrzuceniu oferty}
    - {wzorzec: '{CZYNNOSC}(?:ogłosił\w*\s+)?wyb[oó]r', wartosc: Ogłoszenie wyboru oferty}
    - {wzorzec: '{CZYNNOSC}(?:poinformował\w*\s+o\s+)?wykluczeni', wartosc: Decyzja o wykluczeniu wykonawcy}
    - {wzorzec: '{CZYNNOSC}(?:opublikował\w*|ustaleniu\s+treści|treści)\s+Specyfikacj', wartosc: Publikacja specyfikacji warunków zamówienia (SWZ)}
    - {wzorzec: '{CZYNNOSC}(?:zmodyfikował\w*|modyfikacji)\s+treś', wartosc: Modyfikacja treści SWZ}
    - {wzorzec: '{CZYNNOSC}(?:przekazał\w*\s+wykonawcom\s+)?(?:odpowiedzi|udzieleniu|treści\s+wyjaśnień)', wartosc: Odpowiedzi/wyjaśnienia do SWZ}
    - {wzorzec: '{CZYNNOSC}(?:nie\s+odrzucił|zaniechani\w*\s+odrzucenia)', wartosc: Zaniechanie odrzucenia oferty}
    - {wzorzec: '{CZYNNOSC}(?:nie\s+wykluczył|zaniechani\w*\s+wykluczenia)', wartosc: Zaniechanie wykluczenia wykonawcy}
    - {wzorzec: '{CZYNNOSC}unieważni', wartosc: Decyzja o unieważnieniu postępowania}
    - {wzorzec: '{CZYNNOSC}zaniecha\w*\s+unieważnienia', wartosc: Zaniechanie unieważnienia postępowania}
    - {wzorzec: '{CZYNNOSC}(?:udostępnił\w*\s+Opis|opisaniu|opisu|postanowień\s+Opisu)\s+[Pp]rzedmiotu', wartosc: Opis przedmiotu zamówienia (OPZ)}
    - {wzorzec: '{CZYNNOSC}[^;.]*?projektowan\w*\s+postanowie', wartosc: Projektowane postanowienia umowy}
  OdwolanieKIO.czynnosc_powod_id:
    wzorce: *czynnosci
    slownik: czynnosc_powod

  Odwolujacy[].nazwa:
    utnij: ['{KONIEC_NAZWY}']
    sekcja: &lider '{LIDER}'
    # Osoba fizyczna: nazwa to firma za „pod firmą” („Jan Nowak prowadzący działalność gospodarczą pod firmą” / „<firma>”).
    wzorce: ['{POCZATEK_LINII}(?:(?i:Odwołujący)(?:\s+się)?|\d+\)\s*Lider\s+Konsorcjum)\s*(?![^\n]*prowadząc){WIERSZ_ZA_NAGLOWKIEM}',
             '{POCZATEK_LINII}{NAGLOWEK_ODWOLUJACEGO}[^\n]*pod\s+firmą[ \t]*(?:\n[ \t]*)?([^\n]+)',
             '{POCZATEK_LINII}\d+\)[ \t]*([^\n(]+?)[ \t]*\(Lider']
  Odwolujacy[].krs:
    sekcja: *lider
    wzorce: ['{KRS_Z_ETYKIETA}']
  Odwolujacy[].nip:
    sekcja: *lider
    wzorce: ['{NIP_Z_ETYKIETA}']
    format: cyfry
  Odwolujacy[].regon:
    sekcja: *lider
    wzorce: ['{REGON_Z_ETYKIETA}']
  Odwolujacy[].przez-pelnomocnika:
    sekcja: &odwolujacy '{ODWOLUJACY}'
    wzorce:
    - {wzorzec: 'reprezentowan\w*\s+przez', wartosc: tak}
    - {wzorzec: 'Działając\s+w\s+imieniu\s+własnym', wartosc: nie, sekcja: '[\s\S]+'}
    slownik: tak_nie
  Odwolujacy[].pelnomocnik.imie_nazwisko:
    sekcja: *odwolujacy
    wzorce: ['{PRAWNIK}']
  Odwolujacy[].pelnomocnik.nazwa:
    utnij: ['{KONIEC_NAZWY}']
    sekcja: *odwolujacy
    wzorce: ['korespondenc\w*\s*:\s*([^,]+?)(?=\s*,|\s*\n\s*(?:ul|al|pl|os)\.)']
  Odwolujacy[].pelnomocnik.mail:
    sekcja: *odwolujacy
    wzorce: ['korespondenc\w*[\s\S]*?({EMAIL})']

  Zamawiajacy[].nazwa:
    utnij: ['{KONIEC_NAZWY}']
    sekcja: &zamawiajacy '{ZAMAWIAJACY}'
    podzial: &zamawiajacy_podzial '{PUNKT_ZAMAWIAJACEGO}:[ \t]*\n'
    wzorce: ['{PUNKT_ZAMAWIAJACEGO}{WIERSZ_ZA_NAGLOWKIEM}']
  Zamawiajacy[].krs:
    sekcja: *zamawiajacy
    podzial: *zamawiajacy_podzial
    wzorce: ['{KRS_Z_ETYKIETA}']
  Zamawiajacy[].nip:
    sekcja: *zamawiajacy
    podzial: *zamawiajacy_podzial
    wzorce: ['{NIP_Z_ETYKIETA}']
    format: cyfry
  Zamawiajacy[].regon:
    sekcja: *zamawiajacy
    podzial: *zamawiajacy_podzial
    wzorce: ['{REGON_Z_ETYKIETA}']
  Zamawiajacy[].prowadzacy_postepowanie:
    sekcja: *zamawiajacy
    podzial: *zamawiajacy_podzial
    wzorce:
    - {wzorzec: '\)\s*Zamawiający[^\n:]*(?:Lider|prowadzący)', wartosc: tak}
    - {wzorzec: '\)\s*Zamawiający[^\n:]*Partner', wartosc: nie}
    slownik: tak_nie

  ZamowieniePubliczne.tytul:
    # OCR czyta „ jako przecinek („pn. , Budowa sali …”, skany UZP).
    wzorce: ['pn\.\s*[„,]?\s*([^”"]+)[”"]']
  ZamowieniePubliczne.numer_postepowania:
    wzorce: ['(?i:nr|numer)\s+referencyjn\w*(?:\s+sprawy)?\s*:?\s*({SYGNATURA})']
  ZamowieniePubliczne.numer_bzp:
    wzorce: [{wzorzec: '{ETYKIETA_BZP}{BZP}', wartosc: '{rok}/BZP{nr}{korekta}'}]
  ZamowieniePubliczne.numer_ted:
    wzorce:
    - {wzorzec: '{ETYKIETA_TED}{TED_S}', wartosc: '{nr}-{rok}'}
    - {wzorzec: '{ETYKIETA_TED}{TED}', wartosc: '{nr}-{rok}'}
