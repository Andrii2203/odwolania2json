# Wszystkie liczby programu są w tym pliku (ADR-0009). Przy każdej: skąd się wzięła.
# Liczba z pomiaru ma w komentarzu regułę wyboru i polecenie pomiaru, bez wyników (wyniki się starzeją).
# tools/przeglad.py NAZWA wartości... pokazuje F1, typy i obce dokumenty dla każdej wartości (domyślnie 60 spraw treningowych).
liczby:
  # Najmniejszy odsetek znaczników typu. Najniższy próg, przy którym żaden obcy dokument nie dostaje JSON
  # (tools/przeglad.py PROG 0.4 0.5 0.6 0.75 1); niższy niż 1, by dokument bez jednego znacznika nadal miał typ.
  PROG: 0.6
  # Ile znaków za etykietą szukamy wartości (data, kwota, rachunek, numer). Najmniejsze okno bez spadku F1
  # (tools/przeglad.py OKNO_WARTOSCI 40 60 120 240 500); większe łatwiej łapie cudzą wartość.
  OKNO_WARTOSCI: 120
  # Najdłuższy tekst za etykietą (tytuł przelewu). Z zapasem ponad najmniejsze okno bez spadku F1
  # (tools/przeglad.py OKNO_TEKSTU 100 150 400 1000) na dłuższe tytuły; tekst i tak kończy się na następnej etykiecie ({STOP}).
  OKNO_TEKSTU: 400
  # Ile znaków nie-liter między krótką etykietą a numerem: „NIP: ”, „KRS - ”, „NIP : ” z zapasem.
  # Mniej gubi numery (tools/przeglad.py ODSTEP_ETYKIETY 0 1 2 4 10 20).
  ODSTEP_ETYKIETY: 4
  # Najkrótszy numer transakcji: dłuższy niż rok „2026” i data „30/06”, krótszy niż numery w danych,
  # żeby krótsze numery innych banków przechodziły (tools/przeglad.py DLUGOSC_ID 2 6 16 20).
  DLUGOSC_ID: 6
  # Wcięcie JSON: 2 spacje, jak w przykładach UZP (data/uzp/dane/*/przelew.json).
  WCIECIE_JSON: 2
  # Strona z mniejszą liczbą znaków tekstu idzie do OCR (ADR-0007). Między stroną skanu (bez tekstu)
  # a najkrótszą stroną cyfrową w data/uzp/dane.
  MIN_ZNAKOW_STRONY: 40
  # Rozdzielczość renderowania strony do OCR: najlepsze F1 na skanach UZP (tools/przeglad.py OCR_DPI 150 200 300
  # --dane data/uzp/dane/skany/*). Czas podobny, bo RapidOCR i tak zmniejsza obraz do wykrywania tekstu.
  OCR_DPI: 150
  # Standard PDF: 1 punkt = 1/72 cala (rozmiar strony w PDF jest w punktach).
  PUNKTY_NA_CAL: 72
  # Ramki OCR w jednym wierszu: środki różnią się o mniej niż tyle wysokości ramki. Środek zakresu z najlepszym F1
  # na skanach UZP (tools/przeglad.py TOLERANCJA_WIERSZA 0.3 0.5 0.7 1 --dane data/uzp/dane/skany/*); więcej skleja wiersze.
  TOLERANCJA_WIERSZA: 0.5

# Liczby narzędzi (tools/), nie programu.
narzedzia:
  # Miejsca po przecinku w F1 (tools/ocena_f1.py). Jedno pole zmienia F1 o ok. 1/(2TP+FP+FN), a to kilka tysięcy
  # na 60 sprawach: 4 miejsca pokazują każdą zmianę o jedno pole, 3 część chowają.
  MIEJSCA_F1: 4
  # Najniższe dopuszczalne F1 na data/uzp/dane (test T8): tuż poniżej obecnego F1 z tools/ocena_f1.py, tak by przeszło
  # jedno błędne pole (TP -> FN + FP), a dwa już nie. Podnosimy po każdej poprawie; obniżamy tylko świadomie.
  MIN_F1: 0.9985
  # Najniższe F1 na 3 skanach testu T9 (skany/<typ>/0001): tuż poniżej obecnego F1, więc utrata jednego pola
  # zaczerwienia test.
  MIN_F1_SKANY: 0.96
  # UZP (Discord 21.11): rachunek jak w dokumencie, z „PL”; wzorce treningowe bez „PL” są błędne (ADR-0014).
  # Narzędzia i testy porównują te pola bez prefiksu.
  bez_prefiksu: {prefiks: PL, pola: [z_rachunku, na_rachunek]}
  # Obce dokumenty do pomiaru klasyfikacji (tools/pobierz_obce.py, ADR-0011): polskie ogłoszenia TED z API TED.
  obce_ted:
    # Zamawiający z Polski, ogłoszenia z bieżącego roku (składnia wyszukiwania eksperckiego TED).
    zapytanie: buyer-country=POL AND publication-date>=20260101
    # Ile ogłoszeń: maksimum na jedną stronę wyników API TED (dokumentacja API v3: limit do 250).
    ILE: 250
    # Kod języka PDF w odpowiedzi API (ISO 639-2/B, jak w polu links.pdf).
    jezyk: POL
  # Warianty dokumentów treningowych (tools/warianty.py, ADR-0011). Poprawny JSON znamy, bo wiemy, co zmieniliśmy.
  warianty:
    # Losowań na dokument dla każdej losowej rodziny: kilka tysięcy wariantów na 180 dokumentach w kilka minut.
    WARIANTY: 3
    # Podmieniamy ciągi cyfr dłuższe niż rok (4 cyfry): NIP, KRS, REGON, PESEL, rachunek, numery BZP i TED.
    MIN_CYFR: 5
    # Przesunięcie wszystkich dat dokumentu o tyle samo dni, do roku w obie strony: zmienia dzień, miesiąc, często rok.
    ZAKRES_DNI: 365
    # Rzut monetą dla każdego końca linii: bez założeń, jak często inny PDF łamie linie.
    P_LACZENIA: 0.5
    # Zawijanie do połowy najdłuższej linii dokumentu: układ dwóch kolumn (np. dane stron obok siebie).
    CZESC_SZEROKOSCI: 0.5
    # Ile najgorszych pól wypisać: mieści się na jednym ekranie terminala.
    NAJGORSZE: 20
    # Czym zastępujemy brakującą wartość: nic, albo zapisy spotykane w pismach przy pustym polu.
    braki: ['', 'brak', 'nie dotyczy', '-']
    # Rodzina „nazwy” miesza litery w wartościach pól o tej nazwie (ostatni klucz ścieżki JSON).
    pole_nazwy: nazwa
    # Inne zapisy etykiet niż w danych UZP: wzorzec (Python re, MULTILINE) -> zamiany.
    etykiety:
      '\bNIP:': ['NIP', 'Nr NIP:', 'NIP nr', 'Numer NIP:', 'NIP -']
      '\bREGON:': ['REGON', 'Nr REGON:', 'Numer REGON:']
      '\bKRS:': ['KRS', 'Nr KRS:', 'Numer KRS:', 'KRS nr']
      '^Zamawiający:': ['ZAMAWIAJĄCY:', 'Zamawiający', 'Zamawiający -']
      '^Odwołujący:': ['ODWOŁUJĄCY:', 'Odwołujący', 'Odwołujący się:', 'Wykonawca (Odwołujący):']
      'reprezentowan[ay] przez:': ['reprezentowany przez pełnomocnika:', 'działający przez:']
      'nr referencyjny sprawy:': ['znak sprawy:', 'numer sprawy:', 'nr postępowania:', 'sygn.:']
      'numer ogłoszenia TED:': ['nr ogłoszenia w Dz.U. UE:', 'ogłoszenie w Dzienniku Urzędowym UE nr']
      '^Mocodawca:': ['MOCODAWCA:', 'Mocodawca', 'Udzielający pełnomocnictwa:']
      '^Płatnik': ['Nadawca', 'Zleceniodawca', 'Dane nadawcy']
      '^Beneficjent': ['Odbiorca', 'Dane odbiorcy', 'Nazwa odbiorcy']
      '^Kwota operacji': ['Kwota', 'Kwota przelewu', 'Kwota transakcji']
      '^Data operacji': ['Data', 'Data wykonania', 'Data księgowania', 'Data transakcji']
      '^Tytuł przelewu': ['Tytuł', 'Tytuł operacji', 'Opis transakcji', 'Tytułem']
    # Bloki zamieniane miejscami: nagłówki po kolei, ostatni tylko zamyka.
    bloki:
      - ['^Zamawiający:', '^Odwołujący:', '^dotyczy:']
      - ['^Płatnik', '^Beneficjent', '^Kwota operacji']

# Przełączniki etapów potoku (docs/potok.md, ADR-0012): false wyłącza etap, żeby zmierzyć F1 bez niego.
etapy: {kontekst_sprawy: true}

# Słowa, po których dokument nie jest żadnym z typów (wyrok KIO, ogłoszenie TED). ADR-0002.
wykluczenia: [orzeka, oficjalna nazwa, see the notice]

# Nazwy miesięcy w dopełniaczu, w kolejności od stycznia.
miesiace: [stycznia, lutego, marca, kwietnia, maja, czerwca, lipca, sierpnia, września, października, listopada, grudnia]

# OCR gubi polskie znaki (skany UZP, 2026-11-21: „Odwołujacy”, „ODWOLANIE”, „petnomocnika”, „Lódź”).
# Litera z lewej we wzorcu pasuje też do liter z prawej (poza klasami [...]); wielkie litery tak samo.
warianty_liter: {ą: a, ć: c, ę: e, ł: lt, ń: n, ó: o, ś: s, ź: z, ż: z}

# Poprawki tekstu z OCR przed regułami pól: [wzorzec, zamiana] (Python re.sub). Skany UZP, 2026-11-21.
poprawki_ocr:
  # „Sp. z 0.0.”, „Sp. z 0.o.” -> „Sp. z o.o.”: OCR myli literę o z cyfrą 0 w formie prawnej.
  - ['(?<=\bz )[o0]\.\s?[o0]\.', 'o.o.']
  # „2026/BZP o0692455/03” -> „2026/BZP 00692455/03”: litera o zamiast cyfry 0 na początku numeru BZP.
  - ['(?<=BZP)(\s?)[oO](?=\d)', '\g<1>0']
  # „Lódź” -> „Łódź”: OCR gubi kreskę w Ł (skany UZP, nagłówek pisma i adresy).
  - ['\bL(?=ód[źz]\b)', 'Ł']
  # Etykieta w dwóch liniach komórki tabeli, wartość między nimi: „Data 2026-03-26” / „wykonania” -> „Data wykonania 2026-03-26”.
  - ['(?m)^(?P<a>\w+) (?P<w>[^\n]+)\n(?P<b>wykonania|transakcji|przelewu|nadawcy|odbiorcy|operacji|księgowania|zlecenia)$', '\g<a> \g<b> \g<w>']
  # Kropka środkowa i Ñ to błędy OCR („OŚRODEK·SPORTU”, „PAÑSTWOWEJ”); w polskich dokumentach ich nie ma.
  - ['·', ' ']
  - ['Ñ', 'Ń']
  - ['ñ', 'ń']
  # Słowa z tytułów przelewów i odwołań, w których OCR gubi polski znak („wpis od odwolania”, „OPLATA SKARBOWA”).
  - ['\b(?P<l>[Oo])dwolani', '\g<l>dwołani']
  - ['\bODWOLANI', 'ODWOŁANI']
  - ['\b(?P<l>[Oo])plat', '\g<l>płat']
  - ['\bOPLAT', 'OPŁAT']
  - ['\b(?P<l>[Pp])elnomocni', '\g<l>ełnomocni']
  - ['\bPELNOMOCNI', 'PEŁNOMOCNI']
  - ['\b(?P<l>[Pp])ostepowani', '\g<l>ostępowani']
  - ['\bPOSTEPOWANI', 'POSTĘPOWANI']

# Formaty dat (Python strptime). Nazwa miesiąca jest wcześniej zamieniana na jego numer.
formaty_daty: ['%Y-%m-%d', '%d.%m.%Y', '%d-%m-%Y', '%d/%m/%Y', '%d %m %Y']

# format: tekst obcina te znaki z obu końców wartości.
obcinane_znaki: ' .:-–„”"'

# Bramka `utnij` (ADR-0015) obcina te znaki z końca nazwy przed miejscem cięcia („Belmoria S.A., ul.” -> „Belmoria S.A.”).
obcinane_po_bramce: ' ,;'

# format: liczba: ostatni z tych znaków oddziela grosze („1 234,56”, „1,234.56”); pozostałe znaki niebędące cyframi są pomijane.
separatory_dziesietne: ',.'

# Wspólne fragmenty wzorców: {NAZWA} w polu `wzorce` (ADR-0008). {STOP} tworzy program z etykiet pól typu.
wzorce:
  # Od 0 do OKNO_WARTOSCI dowolnych znaków za etykietą, jak najmniej.
  PO_ETYKIECIE: '[\s\S]{0,{OKNO_WARTOSCI}}?'
  # Od 0 do ODSTEP_ETYKIETY znaków nie-liter.
  ODSTEP: '\W{0,{ODSTEP_ETYKIETY}}'
  # Od 1 do OKNO_TEKSTU znaków, do pierwszej linii zaczynającej się etykietą z {STOP}.
  TEKST: '(?:(?!{POCZATEK_LINII}{STOP})[\s\S]){1,{OKNO_TEKSTU}}'
  # Początek linii i spacje lub tabulatory przed tekstem.
  POCZATEK_LINII: '^[ \t]*'
  # Bramka (etap 5, ADR-0015): tu kończy się nazwa, gdy dane strony są w jednej linii: adres (ul., al., pl., os.),
  # kod pocztowy NN-NNN (standard Poczty Polskiej), numer z etykietą, e-mail, telefon, reprezentacja, „(dalej”.
  KONIEC_NAZWY: ',?\s+(?:ul|al|pl|os)\.\s|(?<!\d)\d\d-\d\d\d(?!\d)|,?\s+(?:KRS|NIP|REGON|PESEL)\b|\S+@\S+|,?\s+tel\.|,?\s+reprezentowan|\s\(dalej'
  # Numer rachunku NRB: 26 cyfr (2 cyfry kontrolne + 24), drukowany w grupach po 4; przed nim kod kraju PL,
  # jeśli jest (IBAN). UZP: numer jak w dokumencie, z „PL” (ADR-0014). Albo IBAN innego kraju (ISO 13616):
  # kod kraju, 2 cyfry kontrolne, 11-30 znaków w grupach po 4, czyli 2-7 pełnych grup i reszta 1-3 znaki (T15).
  RACHUNEK: '(?:PL\s?)?\d{2}(?:\s?\d{4}){6}(?!\d)|[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){2,7}(?:\s?[A-Z0-9]{1,3})?(?![A-Za-z0-9])'
  # Kwota: tysiące w grupach po 3 cyfry (spacja, twarda spacja albo kropka), zawsze 2 cyfry groszy.
  KWOTA: '(?<![\d,.])(?:\d{1,3}(?:[  .]\d{3})+|\d+)[,.]\d{2}(?!\d)'
  # Data: rok 4 cyfry, dzień i miesiąc 1-2 cyfry; RRRR-MM-DD, DD.MM.RRRR, „5 marca 2026”, „20 04 2026” (skany UZP).
  DATA: '(?:\d{4}-\d{2}-\d{2}|(?<!\d)\d{1,2}[.\-/]\d{1,2}[.\-/]\d{4}|(?<!\d)\d{1,2}\s+(?i:{MIESIAC})\s+\d{4}|(?<!\d)\d{1,2} \d{1,2} \d{4}(?!\d))'
  # Wielkie litery, cyfry, „/” i „-”; co najmniej jedna cyfra i co najmniej DLUGOSC_ID znaków.
  IDENTYFIKATOR: '(?<![A-Za-z0-9])(?=[A-Z0-9/-]*\d)(?=[A-Z0-9])[A-Z0-9/-]{{DLUGOSC_ID},}'
  # Między cyframi znanego numeru (kontekst sprawy, ADR-0016; warianty, ADR-0011): odstęp albo myślnik (999-551-93-82).
  ROZDZIELNIK_CYFR: '[\s-]'
  # NIP: 10 cyfr, czasem z myślnikami lub spacjami (999-551-93-82).
  NIP: '(?:\d[ -]?){9}\d(?!\d)'
  # PESEL: 11 cyfr (standard, ustawa o ewidencji ludności).
  PESEL: '\d{11}(?!\d)'
  # KRS: 10 cyfr.
  KRS: '\d{10}(?!\d)'
  # Numer za swoją etykietą („NIP: 999-551-93-82”, „KRS - 0000123456”); grupa 1 to numer.
  NIP_Z_ETYKIETA: 'NIP{ODSTEP}({NIP})'
  KRS_Z_ETYKIETA: 'KRS{ODSTEP}({KRS})'
  REGON_Z_ETYKIETA: 'REGON{ODSTEP}({REGON})'
  PESEL_Z_ETYKIETA: 'PESEL{ODSTEP}({PESEL})'
  # Wielka i mała litera polskiego alfabetu.
  WIELKA: '[A-ZĄĆĘŁŃÓŚŹŻ]'
  MALA: '[a-ząćęłńóśźż]'
  # Imię albo nazwisko, także dwuczłonowe z myślnikiem (Kowalska-Nowak).
  IMIE: '{WIELKA}{MALA}+(?:-{WIELKA}{MALA}+)?'
  # Imię i nazwisko.
  OSOBA: '{IMIE}\s+{IMIE}'
  # Pierwsze słowo nazwy firmy; nie słowo pisma ani funkcja podpisującego („Członek Zarządu” / „Medicor S.A.”, skany UZP).
  SLOWO_FIRMY: '(?<![\w-])(?!(?i:pełnomocnictw|mocodawc|wykonawc|zamawiając|odwołując|prezes|wiceprezes|członek|zarząd|prokurent|dyrektor)){WIELKA}{MALA}[\w&-]*'
  # Dalsze słowa: także skrót wielkimi („Medicor IT Solutions”), przed słowem może stać „i” albo „&” („Drogi i Mosty”).
  # Skrót nie zaczyna nazwy, bo wielkimi bywa tytuł pisma („PEŁNOMOCNICTWO PROCESOWE”) i papier firmowy kancelarii.
  DALSZE_SLOWO_FIRMY: '(?:[i&]\s+)?{WIELKA}[\w&-]*'
  FORMA_PRAWNA: '(?i:S\.\s?A\.|sp\.\s?z\s?o\.\s?o\.|sp\.\s?k\.|sp\.\s?j\.|sp\.\s?p\.|S\.K\.A\.|spółka z ograniczoną odpowiedzialnością|spółka akcyjna|spółka jawna|spółka komandytowa)'
  FIRMA: '{SLOWO_FIRMY}(?:\s+{DALSZE_SLOWO_FIRMY})*\s+{FORMA_PRAWNA}(?:\s+{FORMA_PRAWNA})?'
  # Tytuł zawodowy pełnomocnika przed imieniem i nazwiskiem.
  TYTUL_PRAWNIKA: '(?:r\.\s?pr\.|adw\.|apl\.\s?adw\.|apl\.\s?radc\.|radca\s+prawny|radcy\s+prawnego|adwokat|adwokata)'
  # Pełnomocnik z tytułem („radca prawny Jan Kowalski”); grupa 1 to imię i nazwisko.
  PRAWNIK: '{TYTUL_PRAWNIKA}\s+({OSOBA})'
  # Nazwa miejscowości, także wieloczłonowa (Grabów Nadrzeczny, Bielsko-Biała).
  MIEJSCOWOSC: '{WIELKA}{MALA}+(?:[ -]{WIELKA}{MALA}+)*'
  # REGON: 9 cyfr albo 14 cyfr (jednostka lokalna), standard GUS.
  REGON: '\d{9}(?:\d{5})?(?!\d)'
  EMAIL: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
  # Sygnatura postępowania: od wielkiej litery, kończy się cyfrą (ZP.431.2026, MCLM/ZP/07/2026)
  # albo cyfrą i członem z wielkich liter (PN/58/2026/DOS, skany UZP).
  # Zawsze z separatorem „.”, „/” albo „-”: bez niego to śmieć OCR spod pieczęci („Z2”).
  SYGNATURA: '[A-ZĄĆĘŁŃÓŚŹŻ][\w./-]*[./-][\w./-]*\d(?:/[A-Z]+)?'
  # Numer BZP: rok, „/BZP”, 8 cyfr, opcjonalnie „/” i 2 cyfry korekty (UZP: oczekiwane-json/odwolanie.json).
  BZP: '(?P<rok>\d{4})/BZP\s?(?P<nr>\d{8})(?P<korekta>/\d{2})?'
  # Numer TED: 6 cyfr, „-”, rok (UZP: oczekiwane-json/odwolanie.json).
  TED: '(?P<nr>\d{6})-(?P<rok>\d{4})(?!\d)'
  # Numer TED w zapisie Dziennika Urzędowego UE: rok, „/S”, 3 cyfry numeru wydania, „-”, 6 cyfr.
  TED_S: '(?P<rok>\d{4})/S\s?\d{3}-(?P<nr>\d{6})'

# Słowniki UZP: tekst wartości -> liczba w JSON (pole `slownik` w pliku typu).
slowniki:
  # data/uzp/oczekiwane-json/odwolanie.json: „1- tak, 0- nie”.
  tak_nie: {tak: 1, nie: 0}
  # data/uzp/oczekiwane-json/czynnosc_powod_id_dict.md.
  czynnosc_powod: {Decyzja o odrzuceniu oferty: 1, Ogłoszenie wyboru oferty: 2, Decyzja o wykluczeniu wykonawcy: 3, Publikacja specyfikacji warunków zamówienia (SWZ): 4, Modyfikacja treści SWZ: 5, Odpowiedzi/wyjaśnienia do SWZ: 6, Zaniechanie odrzucenia oferty: 7, Zaniechanie wykluczenia wykonawcy: 8, Decyzja o unieważnieniu postępowania: 9, Zaniechanie unieważnienia postępowania: 10, Opis przedmiotu zamówienia (OPZ): 11, Projektowane postanowienia umowy: 12}
