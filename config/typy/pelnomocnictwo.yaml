typ: pelnomocnictwo
opis: Pełnomocnictwo
znaczniki:
- pełnomocnictw
- [mocodawc, reprezentowani, ustanawiam, udzielam, upoważniam, izbą odwoławczą]
szablon:
  mocodawca:
  - data: {imie_nazwisko: null, krs: null, nazwa: null, nip: null, typ: null}
    podpisujacy:
    - {imie_nazwisko: null}
  pelnomocnicy:
  - {imie_nazwisko: null, pesel: null}
pola:
  mocodawca[].data.nip:
    format: cyfry
    wzorce: ['NIP{ODSTEP}({NIP})']
  mocodawca[].data.krs:
    wzorce: [&krs 'KRS{ODSTEP}({KRS})']
  mocodawca[].data.nazwa:
    wzorce: ['({FIRMA})', 'pod\s+firmą\s+([^,]+?)\s*,']
  mocodawca[].data.typ:
    wzorce:
    - {wzorzec: *krs, wartosc: osoba_prawna}
    - {wzorzec: 'prowadząc\w*\s+działalność\s+gospodarczą', wartosc: osoba_fizyczna}
  mocodawca[].data.imie_nazwisko:
    wzorce: [&podpisany 'niżej\s+podpisan\w*\s+({OSOBA})']
  mocodawca[].podpisujacy[].imie_nazwisko:
    podzial: '{POCZATEK_LINII}W imieniu'
    wzorce:
    - '{POCZATEK_LINII}({OSOBA})[ \t]*\n[ \t]*(?:Prezes|Wiceprezes|Członek|Prokurent|Dyrektor|Wspólnik|Właściciel)'
    - *podpisany
  pelnomocnicy[].imie_nazwisko:
    wzorce: ['{TYTUL_PRAWNIKA}\s+({OSOBA})']
