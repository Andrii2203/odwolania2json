typ: pelnomocnictwo
opis: Pełnomocnictwo
znaczniki:
- pełnomocnictw
- [mocodawc, reprezentowani, ustanawiam, udzielam, upoważniam, izbą odwoławczą]
szablon:
  mocodawca:
  - data: {imie_nazwisko: null, krs: null, nazwa: null, nip: null, typ: null}
    podpisujacy:
    - {imie_nazwisko: null}
  pelnomocnicy:
  - {imie_nazwisko: null, pesel: null}
wzorce:
  # Funkcja osoby, która podpisuje w imieniu mocodawcy („Szymon Brzozowski - Wiceprezes Zarządu”, skany UZP).
  FUNKCJA: '(?:Prezes|Wiceprezes|Członek|Prokurent|Dyrektor|Wspólnik|Właściciel)'
  # Lista pełnomocników bez tytułów: od „udziela pełnomocnictwa:” do „do reprezentowania” (skany UZP:
  # „X (adwokat, …) oraz Y (radca prawny, …)”, „<nr>. X – radca prawny”, imię i nazwisko w osobnych liniach).
  LISTA_PELNOMOCNIKOW: 'udziel\w*\s+pełnomocnictw\w*\s*:[\s\S]*?(?=do\s+reprezentowania)'

pola:
  mocodawca[].data.nip:
    format: cyfry
    wzorce: ['NIP{ODSTEP}({NIP})']
  mocodawca[].data.krs:
    wzorce: [&krs 'KRS{ODSTEP}({KRS})']
  mocodawca[].data.nazwa:
    wzorce: ['({FIRMA})', 'pod\s+firmą\s+([^,]+?)\s*,']
  mocodawca[].data.typ:
    wzorce:
    - {wzorzec: *krs, wartosc: osoba_prawna}
    - {wzorzec: 'prowadząc\w*\s+działalność\s+gospodarczą', wartosc: osoba_fizyczna}
  mocodawca[].data.imie_nazwisko:
    wzorce: [&podpisany 'niżej\s+podpisan\w*\s+({OSOBA})']
  mocodawca[].podpisujacy[].imie_nazwisko:
    podzial: '{POCZATEK_LINII}W imieniu'
    wzorce:
    - '{POCZATEK_LINII}({OSOBA})[ \t]*\n[ \t]*{FUNKCJA}'
    - '({OSOBA})\s*[-–]\s*{FUNKCJA}'
    - *podpisany
  pelnomocnicy[].imie_nazwisko:
    wzorce:
    - '{TYTUL_PRAWNIKA}\s+({OSOBA})'
    - {wzorzec: '({OSOBA})', sekcja: '{LISTA_PELNOMOCNIKOW}'}
  pelnomocnicy[].pesel:
    wzorce: ['PESEL{ODSTEP}({PESEL})']
