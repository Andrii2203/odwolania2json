typ: przelew
opis: Potwierdzenie przelewu
# Potwierdzenie przelewu zawsze podaje nadawcę; SWZ, umowa, faktura i wezwanie do wpisu mówią o przelewie bez nadawcy.
# Nadawca: te same etykiety co pole z_rachunku niżej (kotwica &nadawca).
znaczniki:
- przelew
- &nadawca [rachunek obciążany, z rachunku, rachunek zleceniodawcy, rachunek nadawcy, rachunek płatnika, rachunek źródłowy, zleceniodawca, płatnik, nadawca, dane nadawcy, dane zleceniodawcy]
szablon:
  przelew_bankowy: {data_operacji: null, kwota: null, na_rachunek: null, numer_transakcji: null,
    tytul: null, z_rachunku: null}
pola:
  przelew_bankowy.data_operacji:
    etykiety: [data operacji, data transakcji, data realizacji, data wykonania, data księgowania, data obciążenia, w dniu]
    wzorce: ['({DATA})']
    format: data
  przelew_bankowy.kwota:
    etykiety: [kwota, wartość, w kwocie]
    wzorce: ['({KWOTA})']
    format: liczba
  przelew_bankowy.z_rachunku:
    etykiety: *nadawca
    wzorce: ['({RACHUNEK})']
    format: bez_spacji
  przelew_bankowy.na_rachunek:
    etykiety: [rachunek odbiorcy, na rachunek, rachunek uznawany, rachunek adresata, rachunek beneficjenta, rachunek docelowy, beneficjent, odbiorca, adresat, dane odbiorcy, dane kontrahenta, rachunek kontrahenta]
    wzorce: ['({RACHUNEK})']
    format: bez_spacji
  przelew_bankowy.numer_transakcji:
    etykiety: [nr ref., numer referencyjny, nr referencyjny, numer transakcji, nr transakcji, id transakcji, identyfikator transakcji, identyfikator operacji, numer operacji, nr operacji]
    wzorce: ['({IDENTYFIKATOR})']
  przelew_bankowy.tytul:
    etykiety: [tytuł przelewu, tytuł operacji, tytuł transakcji, opis operacji, opis transakcji, tytułem, tytuł, opis, szczegóły płatności]
    wzorce: ['({TEKST})']
    format: tekst
    utnij: ['{STOP}']
    stop: [status, waluta, opłata/prowizja, prowizja, typ transakcji, dokument, signature]
