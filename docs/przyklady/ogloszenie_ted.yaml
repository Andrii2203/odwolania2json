# Przykład nowego typu dokumentu (README, „Jak dodać nowy typ”): ogłoszenie TED po polsku, prawdziwe dokumenty
# z api.ted.europa.eu. Skopiuj do config/typy/ (albo użyj --config): kod się nie zmienia.
# Uwaga: w ocenie UZP ogłoszenie TED to dokument spoza klas ({}), dlatego ten plik nie leży w config/typy/.
typ: ogloszenie_ted
opis: Ogłoszenie w Dzienniku Urzędowym UE (TED)

# Klasyfikacja: część znaczników (PROG w config/ustawienia.yaml) musi być w tekście.
znaczniki:
- see the notice
- oficjalna nazwa
- nabywca
- numer rejestracyjny
- role tej organizacji
# Wspólne wykluczenia z config/ustawienia.yaml (wyrok KIO, ogłoszenie TED) tego typu nie dotyczą.
wspolne_wykluczenia: false

# Kształt JSON: te klucze trafią do output/, brak wartości = null.
szablon:
  OgloszenieTED: {numer: null, data_publikacji: null, cpv: null}
  Nabywca: {nazwa: null, numer_rejestracyjny: null, miejscowosc: null}

# Fragmenty tylko tego typu.
wzorce:
  # Wartość za „Etykieta:” do końca linii, z liniami dalej bez dwukropka (długa nazwa łamie się w PDF);
  # nagłówek strony („100-2026 Page 2/8”) nie jest dalszą częścią wartości.
  WARTOSC: '[ \t]*([^\n]+(?:\n(?![^\n]*:)(?![^\n]*\sPage\s)[^\n]+)*)'
  # Blok organizacji („ORG-0001”) z rolą „Nabywca” (pierwsza na liście bywa KIO).
  ORGANIZACJA_NABYWCY: 'ORG-\d+[ \t]*\n(?:(?!\S*ORG-\d+[ \t]*\n)[\s\S])*?Role\s+tej\s+organizacji:\s*Nabywca'

# Pola: etykiety (wielkość liter i odstępy bez znaczenia), wzorzec wartości (grupa w nawiasie), format, sekcja.
pola:
  OgloszenieTED.numer:
    wzorce: ['{POCZATEK_LINII}(\S+)\s+Page\s']
  OgloszenieTED.data_publikacji:
    wzorce: ['OJ\s+S\s+\S+\s+({DATA})']
    format: data
  OgloszenieTED.cpv:
    etykiety: [główna klasyfikacja (cpv)]
    wzorce: [':[ \t]*(\d+)']
  Nabywca.nazwa:
    etykiety: [oficjalna nazwa]
    wzorce: [':{WARTOSC}']
  Nabywca.numer_rejestracyjny:
    etykiety: [numer rejestracyjny]
    wzorce: [':{WARTOSC}']
    sekcja: '{ORGANIZACJA_NABYWCY}'
  Nabywca.miejscowosc:
    etykiety: [miejscowość]
    wzorce: [':{WARTOSC}']
    sekcja: '{ORGANIZACJA_NABYWCY}'
